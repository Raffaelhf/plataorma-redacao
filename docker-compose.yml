services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "rm -rf .next/dev .next/cache &&
      npx prisma generate &&
      npx prisma db push --skip-generate &&
      npm run db:rls &&
      npx prisma db seed &&
      npm run dev -- --hostname 0.0.0.0 --webpack"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/redacao_app?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-use-uma-chave-segura}
      NEXTAUTH_URL: http://localhost:${APP_PORT:-3002}
      APP_URL: http://localhost:${APP_PORT:-3002}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-TEST-...}
      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY:-TEST-...}
      SMTP_HOST: ${SMTP_HOST:-smtp.seuprovedor.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-usuario}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-senha}
      SMTP_FROM: ${SMTP_FROM:-Redacao 360 <no-reply@redacao360.com>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      NEXT_WEBPACK_USEPOLLING: "1"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "${APP_PORT:-3002}:3002"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: redacao_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redacao_app"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app_node_modules:
  app_next:
  postgres_data:
